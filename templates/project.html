<!doctype html>
<html lang="it" data-theme="dark">
<head>
<script>try{var _t=localStorage.getItem('geo-theme');if(_t)document.documentElement.setAttribute('data-theme',_t);}catch(e){}</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{PROJECT_NAME}} · GEO Audit · verticalai</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="/static/css/design-system.css">
<style>
  body { min-height:100vh; background:var(--canvas); padding-bottom:var(--sp-16) }
  .topbar {
    position:sticky; top:0;
    background:color-mix(in srgb, var(--canvas) 86%, transparent);
    backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
    border-bottom:1px solid var(--border);
    padding:0 clamp(16px, 4vw, 40px); height:60px;
    display:flex; align-items:center; justify-content:space-between; gap:var(--sp-4);
    z-index:30;
  }
  .logo-row {
    display:flex; align-items:center; gap:10px;
    font-family:var(--font-display); font-size:17px; font-weight:600; color:var(--text); text-decoration:none;
  }
  .logo-mark { width:28px; height:28px; background:var(--brand); border-radius:8px; display:grid; place-items:center; flex:none }
  .logo-mark span { color:#fff; font-family:var(--font-mono); font-weight:600; font-size:14px }
  .logo-ai { color:var(--brand-text) }
  .topbar-actions { display:flex; align-items:center; gap:var(--sp-3) }
  .topbar-user { font-family:var(--font-mono); font-size:12px; color:var(--text-3) }
  .topbar-logout { font-family:var(--font-mono); font-size:12px; color:var(--text-2); text-decoration:none }
  .topbar-logout:hover { color:var(--text) }

  main { max-width:980px; margin:var(--sp-8) auto 0; padding:0 clamp(16px, 4vw, 32px) }

  .back-link { font-size:13px; color:var(--text-3); text-decoration:none; display:inline-block; margin-bottom:var(--sp-3) }
  .back-link:hover { color:var(--text-2) }

  .project-head { margin-bottom:var(--sp-5); display:flex; align-items:flex-start; justify-content:space-between; gap:var(--sp-4); flex-wrap:wrap }
  .project-head h1 { font-size:clamp(22px, 4vw, 28px); margin:0 0 4px; letter-spacing:-.02em }
  .project-head .domain { font-family:var(--font-mono); font-size:13px; color:var(--text-3) }
  .project-actions { display:flex; flex-direction:column; align-items:flex-end; gap:6px }
  .project-actions .rerun-form { display:flex }
  .project-actions .next-scan-note { font-size:12px; color:var(--text-3); margin:0; text-align:right }
  @media (max-width:520px) { .project-head { flex-direction:column } .project-actions { align-items:flex-start } .project-actions .next-scan-note { text-align:left } }

  .tabs { margin-bottom:0 }
  .tab-soon {
    font-size:9px; font-family:var(--font-mono); text-transform:uppercase; letter-spacing:.04em;
    background:var(--surface-2); color:var(--text-3); padding:1px 5px; border-radius:999px;
    margin-left:4px; vertical-align:middle;
  }
  .tab.active .tab-soon, .subtab.active .tab-soon { color:var(--brand-text) }
  .tab.soon:not(.active), .subtab.soon:not(.active) { color:var(--text-3) }

  .subtabs {
    display:flex; gap:2px; overflow-x:auto;
    border-bottom:1px solid var(--border); margin-bottom:var(--sp-6);
  }
  .subtab {
    font-size:13px; font-weight:600; color:var(--text-2); padding:9px 12px;
    border:none; background:none; cursor:pointer; text-decoration:none;
    border-bottom:2px solid transparent; white-space:nowrap;
  }
  .subtab:hover { color:var(--text) }
  .subtab.active { color:var(--brand-text); border-bottom-color:var(--brand) }

  .tab-body .card + .card { margin-top:0 }

  /* Overview grid */
  .ov-grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(200px, 1fr)); gap:var(--sp-4) }
  .ov-score-row { display:flex; align-items:center; gap:var(--sp-3); margin-top:8px }

  .score-block {
    border-radius:var(--r-md); display:flex; flex-direction:column;
    align-items:center; justify-content:center; flex-shrink:0; border:1px solid var(--border);
  }
  .score-block .num { font-family:var(--font-display); font-weight:600; line-height:1 }
  .score-block .grd { font-family:var(--font-mono); font-size:10px; margin-top:2px; color:var(--text-3) }
  .score-ottimo      { background:var(--success-bg);  border-color:var(--success-border) }
  .score-ottimo .num     { color:var(--success) }
  .score-migliorabile    { background:var(--warning-bg);  border-color:var(--warning-border) }
  .score-migliorabile .num   { color:var(--warning) }
  .score-critico     { background:var(--danger-bg);   border-color:var(--danger-border) }
  .score-critico .num    { color:var(--danger) }
  .score-unknown     { background:var(--surface-2);   border-color:var(--border) }
  .score-unknown .num    { color:var(--text-3) }

  .delta-block { display:flex; flex-direction:column; align-items:flex-start; gap:6px }
  .delta-pill { font-family:var(--font-mono); font-size:16px; font-weight:700; padding:5px 12px; border-radius:var(--r-pill); line-height:1 }
  .delta-up   { background:var(--success-bg); color:var(--success) }
  .delta-down { background:var(--danger-bg);  color:var(--danger) }
  .delta-flat { background:var(--surface-2);  color:var(--text-3) }
  .delta-text { font-size:12px; color:var(--text-3) }

  /* Numeri colorati per soglia (score aree, senza box) */
  .txt-ottimo       { color:var(--success) }
  .txt-migliorabile { color:var(--warning) }
  .txt-critico      { color:var(--danger) }
  .txt-unknown      { color:var(--text-3) }

  /* Mini stat box (Salute issue) */
  .mini-stat-row { display:flex; gap:10px }
  .mini-stat {
    flex:1; border-radius:var(--r-md); border:1px solid var(--border); background:var(--surface-2);
    padding:10px 12px; text-align:center;
  }
  .mini-stat-num { display:block; font-family:var(--font-display); font-weight:600; font-size:22px; line-height:1; color:var(--ink) }
  .mini-stat-label { display:block; font-family:var(--font-mono); font-size:10.5px; color:var(--text-3); margin-top:5px; text-transform:uppercase; letter-spacing:.03em }
  .mini-stat.stat-good  { background:var(--success-bg); border-color:var(--success-border) }
  .mini-stat.stat-good .mini-stat-num  { color:var(--success) }
  .mini-stat.stat-warn  { background:var(--warning-bg); border-color:var(--warning-border) }
  .mini-stat.stat-warn .mini-stat-num  { color:var(--warning) }
  .mini-stat.stat-bad   { background:var(--danger-bg);  border-color:var(--danger-border) }
  .mini-stat.stat-bad .mini-stat-num   { color:var(--danger) }
  .mini-stat.stat-neutral .mini-stat-num { color:var(--text-3) }

  /* Coming soon */
  .coming-soon-card { opacity:.72 }

  /* Griglia riepilogo sezioni (Overview) */
  .section-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(220px, 1fr)); gap:var(--sp-3) }
  .section-card {
    display:block; text-decoration:none; color:inherit;
    transition:border-color var(--t-fast), box-shadow var(--t-fast);
  }
  .section-card:hover { border-color:var(--brand); box-shadow:var(--sh-sm); text-decoration:none }
  .section-card-stat { margin-bottom:10px }
  .section-stat-num {
    display:block; font-family:var(--font-display); font-weight:600;
    font-size:32px; line-height:1; color:var(--ink); letter-spacing:-.02em;
  }
  .section-stat-label {
    display:block; font-family:var(--font-mono); font-size:11px; color:var(--text-3);
    text-transform:uppercase; letter-spacing:.04em; margin-top:5px;
  }
  .coming-soon-card .section-stat-num { color:var(--text-3) }
  .section-card-link {
    display:block; margin-top:10px; font-size:12.5px; font-weight:600; color:var(--brand-text);
  }

  /* Area score bars */
  .area-row { display:flex; align-items:center; gap:var(--sp-3); padding:8px 0 }
  .area-label { width:180px; flex-shrink:0; font-size:13.5px; color:var(--text-2) }
  .area-bar-track { flex:1; height:8px; border-radius:999px; background:var(--surface-2); overflow:hidden }
  .area-bar-fill { height:100%; border-radius:999px }
  .area-bar-fill.score-ottimo      { background:var(--success) }
  .area-bar-fill.score-migliorabile { background:var(--warning) }
  .area-bar-fill.score-critico     { background:var(--danger) }
  .area-score { width:32px; text-align:right; font-family:var(--font-mono); font-size:12.5px; color:var(--text-3) }

  .audit-head-row { display:flex; align-items:center; gap:var(--sp-4); flex-wrap:wrap }

  .action-list { list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:var(--sp-3) }
  .action-row { border-bottom:1px solid var(--border); padding-bottom:var(--sp-3) }
  .action-row:last-child { border-bottom:none; padding-bottom:0 }

  .settings-form { display:flex; flex-direction:column; gap:var(--sp-4); max-width:420px }

  /* Score history chart */
  .score-history-head { display:flex; align-items:center; justify-content:space-between; gap:var(--sp-3); flex-wrap:wrap; margin-bottom:var(--sp-4) }
  .range-filter { display:flex; gap:4px; background:var(--surface-2); border-radius:var(--r-md); padding:3px }
  .range-btn { font-family:var(--font-mono); font-size:11.5px; font-weight:600; color:var(--text-3); background:none; border:none; border-radius:calc(var(--r-md) - 3px); padding:6px 10px; cursor:pointer; transition:background .12s,color .12s }
  .range-btn:hover { color:var(--text-2) }
  .range-btn.active { background:var(--surface); color:var(--brand-text); box-shadow:var(--sh-sm) }
  .score-history-body { display:flex; align-items:stretch; gap:var(--sp-5); flex-wrap:wrap }
  .score-history-current-wrap { display:flex; flex-direction:column; align-items:flex-start; justify-content:center; flex:none; min-width:88px }
  .score-history-current { font-family:var(--font-display); font-weight:600; font-size:40px; line-height:1 }
  .score-history-current.score-ottimo { color:var(--success) }
  .score-history-current.score-migliorabile { color:var(--warning) }
  .score-history-current.score-critico { color:var(--danger) }
  .score-history-current.score-unknown { color:var(--text-3) }
  .score-history-current-label { font-family:var(--font-mono); font-size:10.5px; color:var(--text-3); text-transform:uppercase; letter-spacing:.04em; margin-top:4px }
  .score-history-single { display:flex; align-items:center; gap:var(--sp-4) }
  .score-chart-wrap { flex:1; min-width:220px; position:relative }
  .score-chart-svg { width:100%; height:180px; display:block; overflow:visible }
  .score-chart-svg .grid-line { stroke:var(--border); stroke-width:1 }
  .score-chart-svg .grid-label { fill:var(--text-3); font-family:var(--font-mono); font-size:9px }
  .score-chart-svg .score-line { fill:none; stroke:var(--brand); stroke-width:2; stroke-linejoin:round; stroke-linecap:round }
  .score-chart-svg .score-area { fill:var(--brand); opacity:.1; stroke:none }
  .score-chart-svg .score-dot { fill:var(--brand); stroke:var(--surface); stroke-width:3 }
  .score-chart-svg .crosshair-line { stroke:var(--text-3); stroke-width:1; stroke-dasharray:3 3; opacity:0 }
  .score-chart-svg .hover-dot { fill:var(--brand); stroke:var(--surface); stroke-width:2; opacity:0 }
  .score-chart-svg .hit-area { fill:transparent; cursor:crosshair }
  .score-chart-tooltip { position:absolute; pointer-events:none; background:var(--surface); border:1px solid var(--border); border-radius:var(--r-sm); padding:6px 10px; font-size:12px; box-shadow:var(--sh-md); transform:translate(-50%,-115%); white-space:nowrap; z-index:5 }
  .score-chart-tooltip .tip-score { font-family:var(--font-mono); font-weight:700; color:var(--ink) }
  .score-chart-tooltip .tip-date { color:var(--text-3); margin-left:6px }

  @media (max-width:520px) { .topbar { padding:0 var(--sp-4) } .area-label { width:120px } }
  @media (max-width:560px) { .score-history-body { flex-direction:column } .score-history-current-wrap { flex-direction:row; align-items:baseline; gap:8px } }
</style>
</head>
<body>
  <header class="topbar">
    <a href="/" class="logo-row" aria-label="verticalai — home">
      <div class="logo-mark" aria-hidden="true"><span>V</span></div>
      <span><span class="logo-ai">vertical</span>ai</span>
    </a>
    <div class="topbar-actions">
      <button type="button" class="theme-toggle" id="theme-toggle" aria-label="Cambia tema">
        <svg class="i-sun" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
        <svg class="i-moon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>
      </button>
      <span class="topbar-user" id="topbar-user"></span>
      <a href="/auth/logout" class="topbar-logout">Esci</a>
      <a href="/audit" class="btn btn--primary btn--sm">+ Nuova analisi</a>
    </div>
  </header>

  <main>
    <a href="/dashboard" class="back-link">← I tuoi progetti</a>
    <div class="project-head">
      <div>
        <h1>{{PROJECT_NAME}}</h1>
        <div class="domain">{{PROJECT_DOMAIN}}</div>
      </div>
      {{PROJECT_ACTIONS}}
    </div>

    <nav aria-label="Sezioni progetto">{{TABS_NAV}}</nav>

    <div class="tab-body">{{TAB_BODY}}</div>
  </main>

  <script>
    document.getElementById("topbar-user").textContent = {{USER_EMAIL}} || "";
    document.getElementById("theme-toggle").addEventListener("click", function () {
      var cur = document.documentElement.getAttribute("data-theme") === "dark" ? "dark" : "light";
      var next = cur === "dark" ? "light" : "dark";
      document.documentElement.setAttribute("data-theme", next);
      try { localStorage.setItem("geo-theme", next); } catch (e) {}
    });
  </script>
</body>
</html>
