<!doctype html>
<html lang="it">
<head>
<script>
/* Il tema del profilo (deciso dal server) vince su quello del browser, così
   segue l'utente fra dispositivi. Questo script sta in testa alla pagina e
   gira prima di qualsiasi disegno: altrimenti si vedrebbe il lampo del tema
   sbagliato al caricamento. */
(function(){
  var profilo = "{{TEMA_PROFILO}}";
  var t = profilo || null;
  try{
    if (profilo) localStorage.setItem('geo-theme', profilo);
    else t = localStorage.getItem('geo-theme');
  }catch(e){}
  if (t) document.documentElement.setAttribute('data-theme', t);
})();
</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{PROJECT_NAME}} · GEO Audit · verticalai</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/css/geo-ds.css">
<link rel="stylesheet" href="/static/css/ponte-legacy.css">
<style>
  /* Stili dei contenuti dei tab non ancora ridisegnati. Ogni volta che un tab
     passa al nuovo design system, le sue regole spariscono da qui. */

  .mini-stat-row{display:flex; gap:10px; flex-wrap:wrap;}
  .mini-stat{
    flex:1; min-width:110px; border-radius:var(--radius-md);
    border:1px solid var(--border-subtle); background:var(--bg-surface-raised);
    padding:10px 12px; text-align:center;
  }
  .mini-stat-num{display:block; font-family:var(--font-display); font-weight:600; font-size:22px; line-height:1; color:var(--text-primary); font-variant-numeric:tabular-nums;}
  .mini-stat-label{display:block; font-family:var(--font-mono); font-size:10.5px; color:var(--text-muted); margin-top:5px; text-transform:uppercase; letter-spacing:.03em;}
  .mini-stat.stat-good{background:var(--state-good-dim); border-color:var(--state-good-dim);}
  .mini-stat.stat-good .mini-stat-num{color:var(--state-good);}
  .mini-stat.stat-warn{background:var(--state-warn-dim); border-color:var(--state-warn-dim);}
  .mini-stat.stat-warn .mini-stat-num{color:var(--state-warn);}
  .mini-stat.stat-bad{background:var(--state-critical-dim); border-color:var(--state-critical-dim);}
  .mini-stat.stat-bad .mini-stat-num{color:var(--state-critical);}
  .mini-stat.stat-neutral .mini-stat-num{color:var(--text-muted);}

  .coming-soon-card{opacity:.72;}

  .section-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:12px;}
  .section-card-stat{margin-bottom:10px;}
  .section-stat-num{display:block; font-family:var(--font-display); font-weight:600; font-size:32px; line-height:1; color:var(--text-primary); letter-spacing:-.02em; font-variant-numeric:tabular-nums;}
  .section-stat-label{display:block; font-family:var(--font-mono); font-size:11px; color:var(--text-muted); text-transform:uppercase; letter-spacing:.04em; margin-top:5px;}
  .coming-soon-card .section-stat-num{color:var(--text-muted);}
  .section-card-link{display:block; margin-top:10px; font-size:12.5px; font-weight:600; color:var(--accent-primary);}

  /* grafico storico del punteggio (già interattivo, solo ricolorato) */
  .score-history-head{display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:16px;}
  .range-filter{display:flex; gap:4px; background:var(--bg-surface-raised); border-radius:var(--radius-md); padding:3px;}
  .range-btn{font-family:var(--font-mono); font-size:11.5px; font-weight:600; color:var(--text-muted); background:none; border:none; border-radius:calc(var(--radius-md) - 3px); padding:6px 10px; cursor:pointer;}
  .range-btn:hover{color:var(--text-secondary);}
  .range-btn.active{background:var(--accent-primary); color:#fff;}
  .score-history-body{display:flex; align-items:stretch; gap:20px; flex-wrap:wrap;}
  .score-history-current-wrap{display:flex; flex-direction:column; align-items:flex-start; justify-content:center; flex:none; min-width:88px;}
  .score-history-current{font-family:var(--font-display); font-weight:600; font-size:40px; line-height:1; font-variant-numeric:tabular-nums;}
  .score-history-current.score-ottimo{color:var(--state-good);}
  .score-history-current.score-migliorabile{color:var(--state-warn);}
  .score-history-current.score-critico{color:var(--state-critical);}
  .score-history-current.score-unknown{color:var(--text-muted);}
  .score-history-current-label{font-family:var(--font-mono); font-size:10.5px; color:var(--text-muted); text-transform:uppercase; letter-spacing:.04em; margin-top:4px;}
  .score-history-single{display:flex; align-items:center; gap:16px;}
  .score-chart-wrap{flex:1; min-width:220px; position:relative;}
  .score-chart-svg{width:100%; height:180px; display:block; overflow:visible;}
  .score-chart-svg .grid-line{stroke:var(--border-subtle); stroke-width:1;}
  .score-chart-svg .grid-label{fill:var(--text-muted); font-family:var(--font-mono); font-size:9px;}
  .score-chart-svg .score-line{fill:none; stroke:var(--accent-primary); stroke-width:2; stroke-linejoin:round; stroke-linecap:round;}
  .score-chart-svg .score-area{fill:var(--accent-primary); opacity:.1; stroke:none;}
  .score-chart-svg .score-dot{fill:var(--accent-primary); stroke:var(--bg-surface); stroke-width:3;}
  .score-chart-svg .crosshair-line{stroke:var(--text-muted); stroke-width:1; stroke-dasharray:3 3; opacity:0;}
  .score-chart-svg .hover-dot{fill:var(--accent-primary); stroke:var(--bg-surface); stroke-width:2; opacity:0;}
  .score-chart-svg .hit-area{fill:transparent; cursor:crosshair;}
  .score-chart-tooltip{position:absolute; pointer-events:none; background:var(--bg-surface); border:1px solid var(--border-medium); border-radius:var(--radius-sm); padding:6px 10px; font-size:12px; box-shadow:var(--card-shadow); transform:translate(-50%,-115%); white-space:nowrap; z-index:5;}
  .score-chart-tooltip .tip-score{font-family:var(--font-mono); font-weight:700; color:var(--text-primary);}
  .score-chart-tooltip .tip-date{color:var(--text-muted); margin-left:6px;}

  @media (max-width:560px){
    .score-history-body{flex-direction:column;}
    .score-history-current-wrap{flex-direction:row; align-items:baseline; gap:8px;}
  }
</style>
</head>
<body>

<div class="sidebar-overlay" id="sidebarOverlay" onclick="chiudiMenu()"></div>

<div class="app">

  {{SIDEBAR}}

  <div style="display:flex; flex-direction:column; width:100%; min-width:0;">

    <div class="mobile-topbar">
      <button class="hamburger" onclick="apriMenu()" aria-label="Apri il menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
      <div class="brand">
        <div class="brand-mark">V</div>
        <div class="brand-name">vertical<span>ai</span></div>
      </div>
      <button class="theme-toggle" onclick="cambiaTema()" aria-label="Cambia tema">
        <svg class="icon-sun" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
        <svg class="icon-moon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>
      </button>
    </div>

    <div class="page-content">
      <div class="page-header">
        <div>
          <div class="breadcrumb"><a href="/dashboard">I tuoi progetti</a> › {{PROJECT_NAME}}</div>
          <h1>{{PROJECT_NAME}}</h1>
          <div class="domain-sub">{{PROJECT_DOMAIN}}</div>
        </div>
        {{PROJECT_ACTIONS}}
      </div>

      {{SUBTABS}}

      <div class="tab-body">{{TAB_BODY}}</div>
    </div>

  </div>
</div>

<script>
  function apriMenu(){
    document.getElementById('sidebar').classList.add('open');
    document.getElementById('sidebarOverlay').classList.add('open');
  }
  function chiudiMenu(){
    document.getElementById('sidebar').classList.remove('open');
    document.getElementById('sidebarOverlay').classList.remove('open');
  }
  function cambiaTema(){
    var html = document.documentElement;
    var tema = html.getAttribute('data-theme') !== 'dark' ? 'dark' : 'light';
    html.setAttribute('data-theme', tema);
    /* prima nel browser (cambio immediato), poi sul profilo (segue l'utente
       sugli altri dispositivi). Un salvataggio fallito non si segnala: la
       scelta vale comunque qui, e un errore per un colore sarebbe rumore. */
    try{ localStorage.setItem('geo-theme', tema); }catch(e){}
    fetch('/preferenze/tema', {method:'POST', headers:{'Content-Type':'application/json'},
                               body: JSON.stringify({theme: tema})}).catch(function(){});
  }
  document.addEventListener('keydown', function(e){ if (e.key === 'Escape') chiudiMenu(); });
</script>

</body>
</html>
