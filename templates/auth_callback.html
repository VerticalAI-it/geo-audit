<!doctype html>
<html lang="it" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Accesso in corso · verticalai</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="/static/css/design-system.css">
<style>
  body {
    min-height:100vh;
    background:var(--canvas);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:var(--sp-6);
  }
  .wrap { text-align:center; max-width:380px }
  h2 {
    font-size:22px;
    margin:var(--sp-5) 0 var(--sp-2);
    color:var(--ink);
  }
  p { color:var(--text-2); font-size:15px; margin:0 }
  .err {
    display:none;
    background:var(--danger-bg);
    border:1px solid var(--danger-border);
    border-radius:var(--r-md);
    padding:var(--sp-3) var(--sp-4);
    font-size:14px;
    color:var(--danger);
    margin-top:var(--sp-4);
  }
  .err a { color:var(--danger) }
</style>
</head>
<body>
  <div class="wrap">
    <div class="spin" id="spin" style="width:48px;height:48px;margin:0 auto" aria-hidden="true"></div>
    <h2>Accesso in corso…</h2>
    <p>Ti stiamo autenticando. Verrai reindirizzato automaticamente.</p>
    <div class="err" id="err">
      Qualcosa è andato storto. <a href="/">Torna alla home →</a>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script>
    const NEXT = new URLSearchParams(window.location.search).get("next")
                 || localStorage.getItem("geo_login_next")
                 || "/audit";
    localStorage.removeItem("geo_login_next");
    const sb = supabase.createClient("{{SUPABASE_URL}}", "{{SUPABASE_ANON_KEY}}");

    sb.auth.onAuthStateChange(async function(event, session) {
      if (event === "SIGNED_IN" && session) {
        try {
          const resp = await fetch("/auth/set-session", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({
              access_token: session.access_token,
              refresh_token: session.refresh_token,
              next: NEXT
            })
          });
          const data = await resp.json();
          if (data.redirect) {
            window.location.href = data.redirect;
          } else {
            showError();
          }
        } catch(e) {
          showError();
        }
      } else if (event === "SIGNED_OUT") {
        showError();
      }
    });

    function showError() {
      document.getElementById("spin").style.display = "none";
      document.getElementById("err").style.display = "block";
    }

    setTimeout(showError, 8000);
  </script>
</body>
</html>
