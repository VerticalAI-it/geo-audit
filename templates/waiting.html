<!doctype html>
<html lang="it">
<head>
<script>
/* ⚠️ Senza questo, la pagina resta al tema scritto nell'HTML e IGNORA la
   preferenza dell'utente. Sta in testa apposta: se girasse dopo, si vedrebbe
   il lampo del tema sbagliato. Il tema predefinito del prodotto è il chiaro,
   quindi l'assenza di attributo vale «chiaro». */
(function(){
  var t = null;
  try{ t = localStorage.getItem('geo-theme'); }catch(e){}
  if (t) document.documentElement.setAttribute('data-theme', t);
})();
</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="refresh" content="10">
<title>Analisi in corso · verticalai</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="/static/css/design-system.css">
<style>
  body {
    min-height:100vh;
    background:radial-gradient(140% 100% at 70% -5%, #1E1A38 0%, #0B0A12 60%);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:var(--sp-6);
  }

/* ⚠️ Il gradiente del body qui sopra è fisso e scuro: senza questa variante, in
   tema chiaro il testo scuro finisce su un fondo scuro e la pagina non si legge.
   È lo stesso difetto già corretto sulla pagina di accesso, e il tema chiaro è
   quello predefinito del prodotto — quindi tocca la maggior parte di chi arriva.
   Deve stare FUORI dal blocco `body{...}`: infilata dentro spezza il blocco, e
   allora non funziona più niente, né il fondo chiaro né le proprietà che
   seguono. */
[data-theme="light"] body {
  background:radial-gradient(140% 100% at 70% -5%, #EFEDFA 0%, #F6F6FA 60%);
}
  .wrap {
    width:100%;
    max-width:460px;
    text-align:center;
  }
  .logo-row {
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    font-family:var(--font-display);
    font-size:18px;
    font-weight:600;
    color:var(--text);
    margin-bottom:var(--sp-10);
    text-decoration:none;
  }
  .logo-mark {
    width:32px; height:32px;
    background:var(--brand);
    border-radius:9px;
    display:grid; place-items:center;
    box-shadow:var(--sh-brand);
  }
  .logo-mark span { color:#fff; font-family:var(--font-mono); font-weight:600; font-size:16px }
  .logo-ai { color:var(--brand-text) }

  .spin-wrap { margin:0 auto var(--sp-6) }
  h1 {
    font-family:var(--font-display);
    font-size:clamp(22px, 4vw, 28px);
    font-weight:600;
    margin:0 0 var(--sp-3);
    color:var(--ink);
  }
  .url {
    font-family:var(--font-mono);
    font-size:13px;
    color:var(--brand-text);
    margin:0 0 var(--sp-4);
    word-break:break-all;
  }
  p { color:var(--text-2); font-size:15px; margin:0 0 var(--sp-3); line-height:1.6 }
  .refresh-note {
    font-family:var(--font-mono);
    font-size:11px;
    color:var(--text-3);
    margin-top:var(--sp-6);
  }
  .refresh-note a { color:var(--brand-text) }
</style>
</head>
<body>
  <div class="wrap">
    <a href="/" class="logo-row" aria-label="verticalai — home">
      <div class="logo-mark" aria-hidden="true"><span>V</span></div>
      <span><span class="logo-ai">vertical</span>ai</span>
    </a>

    <div class="spin-wrap" role="status" aria-live="polite">
      <div class="spin" style="width:56px;height:56px" aria-hidden="true"></div>
    </div>

    <h1>Analisi in corso…</h1>
    <p class="url">{{URL}}</p>
    <p>Il report è in elaborazione. Questa pagina si aggiorna automaticamente ogni 10 secondi.</p>
    <p>Quando pronto, riceverai anche un'email con il link diretto.</p>

    <p class="refresh-note">
      Aggiornamento automatico · <a href="/r/{{JOB_ID}}">forza ricarica</a>
    </p>
  </div>
</body>
</html>
