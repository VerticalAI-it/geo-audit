<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="refresh" content="10">
<title>Analisi in corso · verticalai</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400..800&family=Hanken+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0B0B16;--card:#17152A;--line:#2A2640;--violet:#6C5CE7;--vbright:#9B8CFF;--text:#F2F1F8;--muted:#9C99B5}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:radial-gradient(120% 80% at 80% -10%,#1a1633 0%,#0B0B16 55%);
    color:var(--text);font-family:"Hanken Grotesk",system-ui,sans-serif;display:flex;align-items:center;justify-content:center;padding:24px}
  .wrap{width:100%;max-width:480px;text-align:center}
  .logo{display:flex;align-items:center;justify-content:center;gap:9px;font-family:"Archivo",sans-serif;font-size:19px;margin-bottom:40px}
  .logo b{font-weight:800}.logo .ai{color:var(--muted)}
  .bars{display:inline-flex;align-items:flex-end;gap:3px;height:22px}
  .bars i{width:5px;border-radius:2px;display:block}
  .b1{height:13px;background:var(--violet)}.b2{height:22px;background:var(--vbright)}.b3{height:9px;background:var(--violet)}
  .spin{width:56px;height:56px;border:4px solid var(--line);border-top-color:var(--vbright);border-radius:50%;
    animation:r 1s linear infinite;margin:0 auto 28px}
  @keyframes r{to{transform:rotate(360deg)}}
  h1{font-family:"Archivo",sans-serif;font-weight:800;font-size:26px;margin:0 0 10px}
  .url{font-family:"IBM Plex Mono",monospace;font-size:13px;color:var(--vbright);margin:0 0 14px;word-break:break-all}
  p{color:var(--muted);font-size:15px;margin:0 0 10px;line-height:1.6}
  .refresh-note{font-family:"IBM Plex Mono",monospace;font-size:11px;color:#6E6B86;margin-top:24px}
  a{color:var(--vbright)}
</style>
</head>
<body>
  <div class="wrap">
    <div class="logo">
      <span class="bars"><i class="b1"></i><i class="b2"></i><i class="b3"></i></span>
      <span><b>vertical</b><span class="ai">ai</span></span>
    </div>
    <div class="spin"></div>
    <h1>Analisi in corso…</h1>
    <p class="url">{{URL}}</p>
    <p>Il report è in elaborazione. Questa pagina si aggiorna automaticamente ogni 10 secondi.</p>
    <p>Quando pronto, riceverai anche un'email con il link diretto.</p>
    <p class="refresh-note">Aggiornamento automatico · <a href="/r/{{JOB_ID}}">forza ricarica</a></p>
  </div>
</body>
</html>
