name: test

# Gira su ogni pull request e su ogni push a main. Sono test offline: non
# toccano rete né database, quindi non servono segreti e non c'è niente che
# possa scrivere per sbaglio in produzione.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # ⚠️ Tutto requirements.txt, non un elenco a mano. Dal 22/09 i test
      # importano `server` e `views` (fastapi, supabase, resend): con le sole
      # BeautifulSoup/lxml/requests la CI è rimasta rossa per settimane, e un
      # check sempre rosso non segnala più le regressioni vere. Importarli
      # senza credenziali è sicuro: i test girano offline anche così.
      - name: Dipendenze
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ⚠️ Prima i test, poi la compilazione: se un test fallisce si vede
      # subito il perché, invece di leggerlo dopo un elenco di file compilati.
      - name: Test
        run: python -m unittest discover -s tests -t . -v

      # Coglie gli errori di sintassi nei file che nessun test importa: script
      # e moduli di servizio che restano fuori dalla suite.
      - name: Sintassi di tutti i moduli
        run: python -m compileall -q . -x '\.venv|\.git|node_modules'
