name: test

# Gira su ogni pull request e su ogni push a main. Sono test offline: non
# toccano rete né database, quindi non servono segreti e non c'è niente che
# possa scrivere per sbaglio in produzione.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # Il motore di audit ha bisogno di BeautifulSoup e lxml per costruire i
      # check: senza, lo snapshot del catalogo non può girare. Il resto delle
      # dipendenze non serve ai test offline.
      - name: Dipendenze
        run: |
          python -m pip install --upgrade pip
          pip install beautifulsoup4 lxml requests

      # ⚠️ Prima i test, poi la compilazione: se un test fallisce si vede
      # subito il perché, invece di leggerlo dopo un elenco di file compilati.
      - name: Test
        run: python -m unittest discover -s tests -t . -v

      # Coglie gli errori di sintassi nei file che nessun test importa —
      # `server.py` fra gli altri, che in CI non si può importare perché
      # vorrebbe le credenziali.
      - name: Sintassi di tutti i moduli
        run: python -m compileall -q . -x '\.venv|\.git|node_modules'
